name: Build Instagram Gallery Helper APK

on:
  push:
    paths:
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/akbar/instagramgalleryhelper

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "InstagramGalleryHelper"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.akbar.instagramgalleryhelper"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.akbar.instagramgalleryhelper"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="Instagram Gallery Helper"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/akbar/instagramgalleryhelper/MainActivity.kt <<'EOF'
          package com.akbar.instagramgalleryhelper

          import android.app.Activity
          import android.content.ContentValues
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(32, 32, 32, 32)
                  }

                  val title = TextView(this).apply {
                      text = "Instagram Gallery Helper"
                      textSize = 22f
                      gravity = Gravity.CENTER
                  }

                  val description = TextView(this).apply {
                      text = "Выбери скачанное видео. Приложение добавит его в Movies/Instagram, чтобы оно появилось в Галерее."
                      textSize = 16f
                      gravity = Gravity.CENTER
                      setPadding(0, 24, 0, 24)
                  }

                  val chooseButton = Button(this).apply {
                      text = "Выбрать видео"
                      setOnClickListener { chooseVideo() }
                  }

                  status = TextView(this).apply {
                      text = "Видео пока не выбрано."
                      textSize = 14f
                      gravity = Gravity.CENTER
                      setPadding(0, 24, 0, 0)
                  }

                  layout.addView(title)
                  layout.addView(description)
                  layout.addView(chooseButton)
                  layout.addView(status)
                  setContentView(layout)
              }

              private fun chooseVideo() {
                  val intent = Intent(Intent.ACTION_OPEN_DOCUMENT).apply {
                      addCategory(Intent.CATEGORY_OPENABLE)
                      type = "video/*"
                  }
                  startActivityForResult(intent, PICK_VIDEO)
              }

              @Deprecated("Uses Android file picker")
              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode != PICK_VIDEO || resultCode != RESULT_OK) return

                  val sourceUri = data?.data ?: return
                  status.text = "Добавляю видео…"

                  Thread {
                      try {
                          val name = getDisplayName(sourceUri)
                          val mime = contentResolver.getType(sourceUri) ?: "video/mp4"

                          val values = ContentValues().apply {
                              put(MediaStore.Video.Media.DISPLAY_NAME, name)
                              put(MediaStore.Video.Media.MIME_TYPE, mime)
                              put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/Instagram")
                              put(MediaStore.Video.Media.IS_PENDING, 1)
                          }

                          val destination = contentResolver.insert(
                              MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                              values
                          ) ?: throw Exception("Не удалось создать файл")

                          try {
                              val input = contentResolver.openInputStream(sourceUri)
                                  ?: throw Exception("Не удалось открыть видео")
                              val output = contentResolver.openOutputStream(destination)
                                  ?: throw Exception("Не удалось записать видео")

                              input.use { source ->
                                  output.use { target ->
                                      source.copyTo(target)
                                  }
                              }

                              val publish = ContentValues().apply {
                                  put(MediaStore.Video.Media.IS_PENDING, 0)
                              }
                              contentResolver.update(destination, publish, null, null)

                          } catch (error: Exception) {
                              contentResolver.delete(destination, null, null)
                              throw error
                          }

                          runOnUiThread {
                              status.text = "Готово! Видео добавлено в Movies/Instagram."
                          }

                      } catch (error: Exception) {
                          runOnUiThread {
                              status.text = "Ошибка: ${error.message}"
                          }
                      }
                  }.start()
              }

              private fun getDisplayName(uri: Uri): String {
                  var result = "Instagram_video.mp4"

                  contentResolver.query(uri, null, null, null, null)?.use { cursor ->
                      val index = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                      if (index >= 0 && cursor.moveToFirst()) {
                          result = cursor.getString(index) ?: result
                      }
                  }

                  return result
              }

              companion object {
                  private const val PICK_VIDEO = 1001
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstagramGalleryHelper-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
