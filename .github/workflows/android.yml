
name: Build Instagram Gallery Helper APK

on:
  push:
    paths:
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false
          packages: ''

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/akbar/instagramgalleryhelper

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "InstagramGalleryHelper"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("com.chaquo.python") version "17.2.0" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }

          android {
              namespace = "com.akbar.instagramgalleryhelper"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.akbar.instagramgalleryhelper"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
                  ndk {
                    abiFilters += listOf("arm64-v8a")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          chaquopy {
             defaultConfig {
                 version = "3.13"
                 pip {
                     install("yt-dlp")
                 }
             }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                   android:name="com.chaquo.python.android.PyApplication"
                   android:allowBackup="false"
                   android:label="InstaSave"
                   android:theme="@android:style/Theme.Material.Light.NoActionBar">
                   <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p app/src/main/python

          cat > app/src/main/python/downloader.py <<'EOF'
          import os
          import yt_dlp

          def download_video(url, output_dir):
              os.makedirs(output_dir, exist_ok=True)

              options = {
                  "format": "best[ext=mp4]/best",
                  "outtmpl": os.path.join(
                      output_dir,
                      "%(title).80s-%(id)s.%(ext)s"
                  ),
                  "noplaylist": True,
                  "quiet": True,
                  "no_warnings": True,
                  "retries": 2,
                  "socket_timeout": 30,
              }

              with yt_dlp.YoutubeDL(options) as ydl:
                  info = ydl.extract_info(url, download=True)
                  return ydl.prepare_filename(info)
          EOF

          cat > app/src/main/java/com/akbar/instagramgalleryhelper/MainActivity.kt <<'EOF'
          package com.akbar.instagramgalleryhelper

          import android.app.Activity
          import android.content.ContentValues
          import android.net.Uri
          import android.os.Bundle
          import android.os.Build
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.webkit.MimeTypeMap
          import com.chaquo.python.Python
          import java.io.File

          class MainActivity : Activity() {

              private lateinit var status: TextView
              private lateinit var downloadButton: Button
              private lateinit var urlInput: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(32, 48, 32, 32)
                  }

                  val title = TextView(this).apply {
                      text = "InstaSave"
                      textSize = 30f
                      gravity = Gravity.CENTER
                  }

                  val description = TextView(this).apply {
                      text = "Скачивай видео и сохраняй их в Галерею"
                      textSize = 16f
                      gravity = Gravity.CENTER
                      setPadding(0, 20, 0, 24)
                  }

                  urlInput = EditText(this).apply {
                      hint = "Вставь ссылку на Instagram"
                      textSize = 15f
                      isSingleLine = true
                  }

                  downloadButton = Button(this).apply {
                      text = "Скачать видео"
                      setOnClickListener {
                          startDownload()
                      }
                  }

                  status = TextView(this).apply {
                      text = "Готов к работе"
                      textSize = 15f
                      gravity = Gravity.CENTER
                      setPadding(0, 24, 0, 0)
                  }

                  layout.addView(title)
                  layout.addView(description)
                  layout.addView(
                      urlInput,
                      LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                      )
                  )
                  layout.addView(downloadButton)
                  layout.addView(status)

                  setContentView(layout)
              }

              private fun startDownload() {
                  val url = urlInput.text.toString().trim()

                  if (url.isEmpty()) {
                      status.text = "Вставь ссылку на видео."
                      return
                  }

                  val host = try {
                      Uri.parse(url).host?.lowercase() ?: ""
                  } catch (e: Exception) {
                      ""
                  }

                  val validHost =
                      host == "instagram.com" ||
                      host.endsWith(".instagram.com") ||
                      host == "instagr.am" ||
                      host.endsWith(".instagr.am")

                  if (!url.startsWith("https://") || !validHost) {
                      status.text = "Введи корректную ссылку Instagram."
                      return
                  }

                  downloadButton.isEnabled = false
                  status.text = "Подготавливаю загрузку..."

                  Thread {
                      try {
                          val outputDir = File(cacheDir, "downloads")
                          outputDir.mkdirs()

                          val python = Python.getInstance()
                          val module = python.getModule("downloader")

                          val result = module.callAttr(
                              "download_video",
                              url,
                              outputDir.absolutePath
                          )

                          val downloadedFile = File(
                              result.toJava(String::class.java)
                          )

                          if (!downloadedFile.exists() ||
                              downloadedFile.length() == 0L) {
                              throw Exception("Файл не найден или пуст.")
                          }

                          saveToGallery(downloadedFile)

                          runOnUiThread {
                              status.text = "Готово! Видео сохранено в Галерею."
                              downloadButton.isEnabled = true
                          }

                      } catch (e: Exception) {
                          runOnUiThread {
                              status.text = "Ошибка: ${e.message}"
                              downloadButton.isEnabled = true
                          }
                      }
                  }.start()
              }

              private fun saveToGallery(file: File) {
                  val extension = file.extension.lowercase()
                  val mime = MimeTypeMap.getSingleton()
                      .getMimeTypeFromExtension(extension) ?: "video/mp4"

                  val values = ContentValues().apply {
                      put(MediaStore.Video.Media.DISPLAY_NAME, file.name)
                      put(MediaStore.Video.Media.MIME_TYPE, mime)

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          put(
                              MediaStore.Video.Media.RELATIVE_PATH,
                              "Movies/InstaSave"
                          )
                          put(MediaStore.Video.Media.IS_PENDING, 1)
                      }
                  }

                  val destination = contentResolver.insert(
                      MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                      values
                  ) ?: throw Exception("Не удалось создать файл в Галерее.")

                  try {
                      val output = contentResolver.openOutputStream(destination)
                          ?: throw Exception("Не удалось записать видео.")

                      output.use { target ->
                          file.inputStream().use { source ->
                              source.copyTo(target)
                          }
                      }

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          val publish = ContentValues().apply {
                              put(MediaStore.Video.Media.IS_PENDING, 0)
                          }
                          contentResolver.update(destination, publish, null, null)
                      }

                  } catch (e: Exception) {
                      contentResolver.delete(destination, null, null)
                      throw e
                  }
              }
          }
          EOF


      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstagramGalleryHelper-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
